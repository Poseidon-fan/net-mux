[package]
name = "net-mux"
version = "1.0.0"
authors = ["Poseidon <18646154381@163.com>"]
edition = "2024"
description = "An async, credit-based connection multiplexing library on top of Tokio"
documentation = "https://docs.rs/net-mux"
readme = "README.md"
repository = "https://github.com/poseidon-fan/net-mux"
license = "MIT"
keywords = ["net", "multiplexing", "async", "tokio", "stream"]
categories = ["asynchronous", "network-programming"]
exclude = [".devcontainer/", "ref/", "docs/images/"]

[dependencies]
bitflags = "2.11"
bytes = "1.10"
futures-util = { version = "0.3", default-features = false, features = [
    "sink",
    "std",
] }
parking_lot = "0.12"
thiserror = "2"
tokio = { version = "1", default-features = false, features = [
    "rt",
    "macros",
    "io-util",
    "sync",
    "time",
    "parking_lot",
] }
tokio-util = { version = "0.7", default-features = false, features = ["codec"] }
tracing = { version = "0.1", default-features = false, features = [
    "std",
    "attributes",
] }

[dev-dependencies]
anyhow = "1"
criterion = { version = "0.5", features = ["async_tokio"] }
proptest = "1"
tokio = { version = "1", features = ["full"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[[bench]]
name = "throughput"
path = "benches/throughput.rs"
harness = false
